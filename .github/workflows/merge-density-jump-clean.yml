name: Merge Density JUMP clean

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean verified merge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/PumpModules.jsx')
          s=p.read_text(encoding='utf-8')
          if 'Density & JUMP — Separate Daily Adjustment' in s and 'densityOpen' in s and 'totalAdjustment' in s:
              print('Density/JUMP already present; nothing to do.')
              raise SystemExit(0)

          # 1) Replace the existing PaymentSection only.
          start=s.index('export function PaymentSection({')
          end=s.index('\n/* =========================================================\n   OPENING SETUP', start)
          payment='''export function PaymentSection({ fuel, payments, setPayments, saleTotals, paymentTotal, diff, creditTotal }) {
  const paymentMethods = [["cash","Cash"],["paytm","Paytm"],["card","ATM / Card"],["dtplus","DT Plus"],["hppay","HP Pay"],["phonepe","PhonePe"],["credit","Party Receivable / Credit"],["pumpExpense","Expense"]];
  const digital=["paytm","card","dtplus","hppay","phonepe"].reduce((a,k)=>a+n(payments[fuel]?.[k]),0);
  const expense=n(payments[fuel]?.pumpExpense);
  const densityExpense=(fuel==="MS"||fuel==="HSD")?n(payments[fuel]?.densityExpense):0;
  const jump=n(payments[fuel]?.jump);
  const setField=(key,value)=>setPayments(p=>({...p,[fuel]:{...p[fuel],[key]:value}}));
  return <section className="panel" style={{marginTop:18}}>
    <h2>{fuel} Payment Breakdown</h2>
    <p>Actual receiving अलग भरें. <b>Density</b> केवल MS/HSD के लिए है; <b>JUMP</b> MS/HSD/CNG में अलग दर्ज होगी.</p>
    <div className="form">{paymentMethods.map(([k,l])=><Field key={k} label={l}><input type="number" step=".01" value={k==="credit"?creditTotal:(payments[fuel]?.[k]??"")} readOnly={k==="credit"} className={k==="credit"?"readonly":""} onChange={e=>k!=="credit"&&setField(k,e.target.value)}/></Field>)}</div>
    <div className="actions" style={{marginTop:10}}>{(fuel==="MS"||fuel==="HSD")&&<button type="button" className="btn" onClick={()=>setField("densityOpen",!payments[fuel]?.densityOpen)}>🧪 Density</button>}<button type="button" className="btn" onClick={()=>setField("jumpOpen",!payments[fuel]?.jumpOpen)}>↕️ JUMP</button></div>
    {payments[fuel]?.densityOpen&&(fuel==="MS"||fuel==="HSD")&&<div className="form" style={{marginTop:10}}><Field label={`Density — ${fuel} Reading`}><input value={payments[fuel]?.densityReading??""} placeholder="जैसे 0.7420" onChange={e=>setField("densityReading",e.target.value)}/></Field><Field label={`Density — ${fuel} Expense (₹)`}><input type="number" step=".01" min="0" value={payments[fuel]?.densityExpense??""} placeholder="वास्तविक खर्च" onChange={e=>setField("densityExpense",e.target.value)}/></Field></div>}
    {payments[fuel]?.jumpOpen&&<div className="form" style={{marginTop:10}}><Field label={`JUMP — ${fuel} (₹)`}><input type="number" step=".01" min="0" value={payments[fuel]?.jump??""} placeholder="वास्तविक JUMP राशि" onChange={e=>setField("jump",e.target.value)}/></Field></div>}
    <div className="total-box"><div className="mini"><span>SALE</span><strong>{money(saleTotals[fuel])}</strong></div><div className="mini"><span>PAYMENT</span><strong>{money(paymentTotal(fuel))}</strong></div><div className="mini"><span>CASH</span><strong>{money(payments[fuel]?.cash)}</strong></div><div className="mini"><span>DIGITAL</span><strong>{money(digital)}</strong></div><div className="mini"><span>DENSITY EXPENSE</span><strong>{money(densityExpense)}</strong></div><div className="mini"><span>JUMP</span><strong>{money(jump)}</strong></div><div className="mini"><span>EXPENSE</span><strong>{money(expense)}</strong></div></div>
    {Math.abs(diff[fuel])<=0.50?<div className="balance-ok">✓ {fuel} Payment matches Sale — Difference ₹0.00</div>:<div className="balance-bad">⚠ {fuel} Difference: {money(diff[fuel])}</div>}
  </section>;
}
'''
          s=s[:start]+payment+s[end:]

          # 2) Fuel Sale total reconciliation.
          old='''  const totalDifference = rupee(
    totalSale - totalPayment - totalPumpExpense
  );'''
          new='''  const totalDensityExpense = n(payments.MS?.densityExpense) + n(payments.HSD?.densityExpense);
  const totalJump = n(payments.MS?.jump) + n(payments.HSD?.jump) + n(payments.CNG?.jump);
  const totalDifference = rupee(
    totalSale - totalPayment - totalPumpExpense - totalDensityExpense - totalJump
  );'''
          if old not in s: raise SystemExit('Fuel Sale totalDifference marker not found')
          s=s.replace(old,new,1)

          # 3) Daily Sale Summary payment compatibility + Density/JUMP.
          ds=s.index('export function DailySaleSummary({ data })')
          a=s.index('  const paymentRowsForDate =',ds)
          b=s.index('  const pendingBefore = previousPending(data, date);',a)
          block='''  const paymentRowsForDate = (data.dailyPayments || []).filter(r => String(r?.date || "") === String(date));
  const paymentRowScore = row => ["MS","HSD","CNG"].reduce((score,fuel)=>{
    const p=row?.[fuel]; if(!p||typeof p!=="object") return score;
    return score+["cash","paytm","card","dtplus","hppay","phonepe","credit","pumpExpense","other","densityExpense","jump"].reduce((n,k)=>n+(p[k]!==undefined&&p[k]!==""?1:0),0);
  },0);
  const payment = paymentRowsForDate.reduce((best,row)=>!best||paymentRowScore(row)>paymentRowScore(best)?row:best,null) || savedPayment(data,date) || {};
  const creditByFuel = { MS: creditTotalForFuel(data,date,"MS"), HSD: creditTotalForFuel(data,date,"HSD"), CNG: creditTotalForFuel(data,date,"CNG") };
  const paymentForFuel = fuel => {
    const p=payment?.[fuel]||{};
    const standard=paymentForFuelStandard(data,date,fuel)||{};
    const cash=n(p.cash??standard.cash), paytm=n(p.paytm??standard.paytm), card=n(p.card??standard.card);
    const dtplus=n(p.dtplus??p.dtPlus??standard.dtplus), hppay=n(p.hppay??p.hpPay??standard.hppay), phonepe=n(p.phonepe??p.phonePe??standard.phonepe);
    const savedCredit=n(p.credit??p.udhari??standard.credit), credit=n(creditByFuel[fuel])>0?n(creditByFuel[fuel]):savedCredit;
    const pumpExpense=n(p.pumpExpense??standard.pumpExpense)+(p.pumpExpense===undefined?n(p.other):0);
    const densityExpense=(fuel==="MS"||fuel==="HSD")?n(p.densityExpense):0;
    const jump=n(p.jump);
    const receiptTotal=cash+paytm+card+dtplus+hppay+phonepe;
    const reconciliationTotal=receiptTotal+credit;
    const adjustedTotal=reconciliationTotal+pumpExpense+densityExpense+jump;
    return {cash,paytm,card,dtplus,hppay,phonepe,credit,other:pumpExpense,pumpExpense,densityReading:p.densityReading||"",densityExpense,jump,total:reconciliationTotal,receiptTotal,adjustedTotal,difference:rupee(fuelSummary[fuel].amount-adjustedTotal)};
  };

'''
          s=s[:a]+block+s[b:]

          # 4) Daily Summary total difference.
          ds=s.index('export function DailySaleSummary({ data })')
          c=s.index('  const totalPumpExpense =',ds)
          d=s.index('  const paymentMethods = METHODS;',c)
          seg=s[c:d]
          old_seg='''  const totalPumpExpense =
    paymentsByFuel.MS.pumpExpense +
    paymentsByFuel.HSD.pumpExpense +
    paymentsByFuel.CNG.pumpExpense;

  // Expense was paid before the salesman deposited cash. Therefore it
  // reduces the cash to be deposited, but it still belongs to the expense
  // account and must be added back for sale reconciliation.
  const totalDifference = rupee(totalSale - totalPayment - totalPumpExpense);
'''
          new_seg='''  const totalPumpExpense =
    paymentsByFuel.MS.pumpExpense +
    paymentsByFuel.HSD.pumpExpense +
    paymentsByFuel.CNG.pumpExpense;
  const totalAdjustment=["MS","HSD","CNG"].reduce((sum,fuel)=>sum+n(paymentsByFuel[fuel].densityExpense)+n(paymentsByFuel[fuel].jump),0);
  const totalDifference=rupee(totalSale-totalPayment-totalPumpExpense-totalAdjustment);
'''
          if old_seg not in seg: raise SystemExit('Daily totalDifference block not found')
          seg=seg.replace(old_seg,new_seg,1)
          s=s[:c]+seg+s[d:]

          # 5) Visible separate Density/JUMP report.
          marker='''      <section className="panel" style={{ marginTop: 18 }}>
        <h3>Reconciliation Difference / Recovery — Fuel-wise</h3>'''
          insert='''      <section className="panel" style={{ marginTop: 18 }}>
        <h3>Density & JUMP — Separate Daily Adjustment</h3>
        <div className="table"><table><thead><tr><th>Fuel</th><th>Density Reading</th><th>Density Expense</th><th>JUMP</th></tr></thead><tbody>
          {["MS","HSD","CNG"].map(fuel=>{const p=paymentsByFuel[fuel];return <tr key={fuel}><td><b>{fuel}</b></td><td>{fuel==="CNG"?"—":(p.densityReading||"—")}</td><td>{fuel==="CNG"?"—":money(p.densityExpense)}</td><td>{money(p.jump)}</td></tr>;})}
          <tr className="total-row"><td><b>TOTAL</b></td><td>—</td><td><b>{money(n(paymentsByFuel.MS.densityExpense)+n(paymentsByFuel.HSD.densityExpense))}</b></td><td><b>{money(n(paymentsByFuel.MS.jump)+n(paymentsByFuel.HSD.jump)+n(paymentsByFuel.CNG.jump))}</b></td></tr>
        </tbody></table></div>
        <p style={{marginBottom:0,color:"#6b7280"}}>Density और JUMP को Difference में दोबारा नहीं गिना जाएगा।</p>
      </section>

'''+marker
          if marker not in s: raise SystemExit('Daily reconciliation marker not found')
          s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'densityOpen' src/components/PumpModules.jsx
          grep -q 'Density & JUMP — Separate Daily Adjustment' src/components/PumpModules.jsx
          grep -q 'totalAdjustment' src/components/PumpModules.jsx
      - name: Build check
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PumpModules.jsx
          git commit -m 'feat: merge verified Density and JUMP controls' || exit 0
          git push
