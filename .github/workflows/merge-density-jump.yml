name: Merge Density JUMP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply verified minimal merge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/PumpModules.jsx')
          s=p.read_text(encoding='utf-8')

          # Replace only PaymentSection. This adds Density (MS/HSD) and JUMP (MS/HSD/CNG)
          # without touching Fuel Sale, Credit Sale, Opening Setup or Party Master.
          start=s.index('export function PaymentSection({')
          end=s.index('\n/* =========================================================\n   OPENING SETUP', start)
          payment='''export function PaymentSection({\n  fuel, payments, setPayments, saleTotals, paymentTotal, diff, creditTotal\n}) {\n  const paymentMethods = [\n    ["cash", "Cash"], ["paytm", "Paytm"], ["card", "ATM / Card"],\n    ["dtplus", "DT Plus"], ["hppay", "HP Pay"], ["phonepe", "PhonePe"],\n    ["credit", "Party Receivable / Credit"], ["pumpExpense", "Expense"]\n  ];\n  const digital=["paytm","card","dtplus","hppay","phonepe"].reduce((a,k)=>a+n(payments[fuel]?.[k]),0);\n  const expense=n(payments[fuel]?.pumpExpense);\n  const densityExpense=(fuel==="MS"||fuel==="HSD")?n(payments[fuel]?.densityExpense):0;\n  const jump=n(payments[fuel]?.jump);\n  const setField=(key,value)=>setPayments(p=>({...p,[fuel]:{...p[fuel],[key]:value}}));\n  return <section className="panel" style={{marginTop:18}}>\n    <h2>{fuel} Payment Breakdown</h2>\n    <p>Actual receiving अलग भरें. <b>Density</b> केवल MS/HSD के लिए है; <b>JUMP</b> MS/HSD/CNG में अलग दर्ज होगी.</p>\n    <div className="form">{paymentMethods.map(([k,l])=><Field key={k} label={l}>\n      <input type="number" step=".01" value={k==="credit"?creditTotal:(payments[fuel]?.[k]??"")} readOnly={k==="credit"} className={k==="credit"?"readonly":""} onChange={e=>k!=="credit"&&setField(k,e.target.value)} />\n    </Field>)}</div>\n    <div className="actions" style={{marginTop:10}}>\n      {(fuel==="MS"||fuel==="HSD")&&<button type="button" className="btn" onClick={()=>setField("densityOpen",!payments[fuel]?.densityOpen)}>🧪 Density</button>}\n      <button type="button" className="btn" onClick={()=>setField("jumpOpen",!payments[fuel]?.jumpOpen)}>↕️ JUMP</button>\n    </div>\n    {payments[fuel]?.densityOpen&&(fuel==="MS"||fuel==="HSD")&&<div className="form" style={{marginTop:10}}>\n      <Field label={`Density — ${fuel} Reading`}><input value={payments[fuel]?.densityReading??""} placeholder="जैसे 0.7420" onChange={e=>setField("densityReading",e.target.value)}/></Field>\n      <Field label={`Density — ${fuel} Expense (₹)`}><input type="number" step=".01" min="0" value={payments[fuel]?.densityExpense??""} placeholder="वास्तविक खर्च" onChange={e=>setField("densityExpense",e.target.value)}/></Field>\n    </div>}\n    {payments[fuel]?.jumpOpen&&<div className="form" style={{marginTop:10}}>\n      <Field label={`JUMP — ${fuel} (₹)`}><input type="number" step=".01" min="0" value={payments[fuel]?.jump??""} placeholder="वास्तविक JUMP राशि" onChange={e=>setField("jump",e.target.value)}/></Field>\n    </div>}\n    <div className="total-box">\n      <div className="mini"><span>SALE</span><strong>{money(saleTotals[fuel])}</strong></div>\n      <div className="mini"><span>PAYMENT</span><strong>{money(paymentTotal(fuel))}</strong></div>\n      <div className="mini"><span>CASH</span><strong>{money(payments[fuel]?.cash)}</strong></div>\n      <div className="mini"><span>DIGITAL</span><strong>{money(digital)}</strong></div>\n      <div className="mini"><span>DENSITY EXPENSE</span><strong>{money(densityExpense)}</strong></div>\n      <div className="mini"><span>JUMP</span><strong>{money(jump)}</strong></div>\n      <div className="mini"><span>EXPENSE</span><strong>{money(expense)}</strong></div>\n    </div>\n    {Math.abs(diff[fuel])<=0.50?<div className="balance-ok">✓ {fuel} Payment matches Sale — Difference ₹0.00</div>:<div className="balance-bad">⚠ {fuel} Difference: {money(diff[fuel])}</div>}\n  </section>;\n}\n'''
          s=s[:start]+payment+s[end:]

          # Fuel Sale reconciliation: Density and JUMP count once as adjustments.
          old='''  const totalDifference = rupee(\n    totalSale - totalPayment - totalPumpExpense\n  );'''
          new='''  const totalDensityExpense = n(payments.MS?.densityExpense) + n(payments.HSD?.densityExpense);\n  const totalJump = n(payments.MS?.jump) + n(payments.HSD?.jump) + n(payments.CNG?.jump);\n  const totalDifference = rupee(\n    totalSale - totalPayment - totalPumpExpense - totalDensityExpense - totalJump\n  );'''
          if old not in s: raise SystemExit('Fuel Sale totalDifference marker not found')
          s=s.replace(old,new,1)

          # Daily Sale Summary: use the most complete payment row and expose Density/JUMP.
          ds=s.index('export function DailySaleSummary({ data })')
          a=s.index('  const payment = savedPayment(data, date) || {};',ds)
          b=s.index('\n  const paymentsByFuel = {',a)
          block='''  const paymentRowsForDate = (data.dailyPayments || []).filter(r => String(r?.date || "") === String(date));\n  const paymentRowScore = row => ["MS","HSD","CNG"].reduce((score,fuel)=>{\n    const p=row?.[fuel]; if(!p||typeof p!=="object") return score;\n    return score+["cash","paytm","card","dtplus","hppay","phonepe","credit","pumpExpense","other","densityExpense","jump"].reduce((n,k)=>n+(p[k]!==undefined&&p[k]!==""?1:0),0);\n  },0);\n  const payment = paymentRowsForDate.reduce((best,row)=>!best||paymentRowScore(row)>paymentRowScore(best)?row:best,null) || savedPayment(data,date) || {};\n  const creditByFuel = {\n    MS: creditTotalForFuel(data,date,"MS"), HSD: creditTotalForFuel(data,date,"HSD"), CNG: creditTotalForFuel(data,date,"CNG")\n  };\n  const paymentForFuel = fuel => {\n    const p=payment?.[fuel]||{};\n    const standard=paymentForFuelStandard(data,date,fuel)||{};\n    const cash=n(p.cash??standard.cash), paytm=n(p.paytm??standard.paytm), card=n(p.card??standard.card);\n    const dtplus=n(p.dtplus??p.dtPlus??standard.dtplus), hppay=n(p.hppay??p.hpPay??standard.hppay), phonepe=n(p.phonepe??p.phonePe??standard.phonepe);\n    const savedCredit=n(p.credit??p.udhari??standard.credit), credit=n(creditByFuel[fuel])>0?n(creditByFuel[fuel]):savedCredit;\n    const pumpExpense=n(p.pumpExpense??standard.pumpExpense)+(p.pumpExpense===undefined?n(p.other):0);\n    const densityExpense=(fuel==="MS"||fuel==="HSD")?n(p.densityExpense):0;\n    const jump=n(p.jump);\n    const receiptTotal=cash+paytm+card+dtplus+hppay+phonepe;\n    const reconciliationTotal=receiptTotal+credit;\n    const adjustedTotal=reconciliationTotal+pumpExpense+densityExpense+jump;\n    return {cash,paytm,card,dtplus,hppay,phonepe,credit,other:pumpExpense,pumpExpense,densityReading:p.densityReading||"",densityExpense,jump,total:reconciliationTotal,receiptTotal,adjustedTotal,difference:rupee(fuelSummary[fuel].amount-adjustedTotal)};\n  };\n'''
          s=s[:a]+block+s[b:]
          # Replace Daily Summary total difference with adjustment-aware formula.
          ds=s.index('export function DailySaleSummary({ data })')
          c=s.index('  const totalPumpExpense =',ds)
          d=s.index('\n\n  const paymentMethods = METHODS;',c)
          chunk=s[c:d]
          chunk=re.sub(r'const totalPumpExpense =([\s\S]*?)\n\s*// Expense was paid[\s\S]*?const totalDifference = rupee\(totalSale - totalPayment - totalPumpExpense\);', '''const totalPumpExpense =\n    paymentsByFuel.MS.pumpExpense + paymentsByFuel.HSD.pumpExpense + paymentsByFuel.CNG.pumpExpense;\n  const totalAdjustment=["MS","HSD","CNG"].reduce((sum,fuel)=>sum+n(paymentsByFuel[fuel].densityExpense)+n(paymentsByFuel[fuel].jump),0);\n  const totalDifference=rupee(totalSale-totalPayment-totalPumpExpense-totalAdjustment);''',chunk,count=1)
          s=s[:c]+chunk+s[d:]

          # Add a visible separate Density/JUMP report block before reconciliation.
          marker='''      <section className="panel" style={{ marginTop: 18 }}>\n        <h3>Reconciliation Difference / Recovery — Fuel-wise</h3>'''
          insert='''      <section className="panel" style={{ marginTop: 18 }}>\n        <h3>Density & JUMP — Separate Daily Adjustment</h3>\n        <div className="table"><table><thead><tr><th>Fuel</th><th>Density Reading</th><th>Density Expense</th><th>JUMP</th></tr></thead><tbody>\n          {["MS","HSD","CNG"].map(fuel=>{const p=paymentsByFuel[fuel];return <tr key={fuel}><td><b>{fuel}</b></td><td>{fuel==="CNG"?"—":(p.densityReading||"—")}</td><td>{fuel==="CNG"?"—":money(p.densityExpense)}</td><td>{money(p.jump)}</td></tr>;})}\n          <tr className="total-row"><td><b>TOTAL</b></td><td>—</td><td><b>{money(n(paymentsByFuel.MS.densityExpense)+n(paymentsByFuel.HSD.densityExpense))}</b></td><td><b>{money(n(paymentsByFuel.MS.jump)+n(paymentsByFuel.HSD.jump)+n(paymentsByFuel.CNG.jump))}</b></td></tr>\n        </tbody></table></div>\n        <p style={{marginBottom:0,color:"#6b7280"}}>Density और JUMP को Difference में दोबारा नहीं गिना जाएगा।</p>\n      </section>\n\n'''+marker
          if marker not in s: raise SystemExit('Daily Summary reconciliation marker not found')
          s=s.replace(marker,insert,1)

          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'Density & JUMP — Separate Daily Adjustment' src/components/PumpModules.jsx
          grep -q 'densityExpense' src/components/PumpModules.jsx
          grep -q 'jumpOpen' src/components/PumpModules.jsx
          grep -q 'totalAdjustment' src/components/PumpModules.jsx
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PumpModules.jsx
          git commit -m 'feat: add verified Density and JUMP' || exit 0
          git push
