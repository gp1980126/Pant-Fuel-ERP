name: apply-final-summary
on:
  push:
    paths:
      - '.github/final-summary-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patch_final_summary.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PumpModules.jsx
          git diff --cached --quiet || (git commit -m 'fix: show density and jump in final daily summary' && git push)
