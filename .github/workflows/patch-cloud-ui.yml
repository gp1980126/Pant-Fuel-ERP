name: Patch Cloud UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-cloud-ui:
    if: ${{ !contains(github.event.head_commit.message, 'fix: expose Cloud button') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expose Cloud button
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          old = '''{CLOUD_ENABLED && <button type="button" className="btn small" title="Load latest data directly from Supabase" onClick={async () => { const r = await refreshCloudData(); if (r.ok) alert(`☁️ Latest cloud data loaded.

Credits: ${r.count}`); else alert(`❌ Cloud refresh failed

${r.reason}`); }}>↻ Cloud Refresh</button>}'''
          new = '''<button type="button" className="btn small" title="Cloud data / Supabase" onClick={async () => {
            if (!CLOUD_ENABLED) {
              alert("☁️ Cloud button is ready, but this deployment is not connected to Supabase yet. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Vercel, then redeploy.");
              return;
            }
            const r = await refreshCloudData();
            if (r.ok) alert(`☁️ Latest cloud data loaded.\\n\\nCredits: ${r.count}`);
            else alert(`❌ Cloud refresh failed\\n\\n${r.reason}`);
          }}>{CLOUD_ENABLED ? "☁️ Cloud" : "☁️ Cloud (Setup)"}</button>'''
          if old not in s:
              raise SystemExit('Expected Cloud Refresh block was not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Verify Cloud button
        run: |
          grep -q '☁️ Cloud' src/App.jsx
          grep -q 'VITE_SUPABASE_URL' src/App.jsx

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/patch-cloud-ui.yml
          git commit -m "fix: expose Cloud button"
          git rm .github/workflows/patch-cloud-ui.yml
          git commit -m "chore: remove one-shot Cloud UI patch workflow"
          git push