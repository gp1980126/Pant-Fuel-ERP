name: Patch Cloud UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-cloud-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expose Cloud button
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          start = s.find('{CLOUD_ENABLED && <button')
          end_marker = '↻ Cloud Refresh</button>}'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Expected Cloud Refresh block was not found; no changes made.')
          end += len(end_marker)
          new = ('<button type="button" className="btn small" title="Cloud data / Supabase" '
                 'onClick={async () => {\n'
                 '  if (!CLOUD_ENABLED) {\n'
                 '    alert("☁️ Cloud button is ready, but this deployment is not connected to Supabase yet. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in Vercel, then redeploy.");\n'
                 '    return;\n'
                 '  }\n'
                 '  const r = await refreshCloudData();\n'
                 '  if (r.ok) alert(`☁️ Latest cloud data loaded.\\n\\nCredits: ${r.count}`);\n'
                 '  else alert(`❌ Cloud refresh failed\\n\\n${r.reason}`);\n'
                 '}}> {CLOUD_ENABLED ? "☁️ Cloud" : "☁️ Cloud (Setup)"}</button>').replace('}> {', '}>{')
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')

      - name: Verify Cloud button
        run: |
          grep -q '☁️ Cloud' src/App.jsx
          grep -q 'VITE_SUPABASE_URL' src/App.jsx

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/workflows/patch-cloud-ui.yml
          git commit -m "fix: expose Cloud button"
          git push