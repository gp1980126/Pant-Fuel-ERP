name: StationMitra isolated release checks

on:
  push:
    branches:
      - audit/isolation-hardening-2026-11-16
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolated-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated hardening branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run parse, regression and build gates
        run: npm run release-check
