name: daily-credit-integrity-fix-v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-credit-integrity-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx and clean up
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/App.jsx'); s=p.read_text(); old='        next.dailyPayments = syncCreditPayments(next.dailyPayments, next.credits);'; assert old in s, 'target line not found'; p.write_text(s.replace(old, '        // Credit Sale is the source of truth; do not rewrite protected Daily Payment rows during Credit Save.'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: prevent credit save from mutating daily payments"
          git rm .github/workflows/fix-daily-credit-integrity-v2.yml .github/workflows/fix-daily-credit-integrity.yml || true
          git commit -m "chore: remove temporary integrity workflows"
          git push